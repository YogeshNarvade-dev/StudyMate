services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studymate
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studymate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: change-this-development-secret-to-a-long-random-string-123456
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
