spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/studymate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpass}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  upload:
    dir: uploads
    max-file-size: 10485760

  jwt:
    secret: ${JWT_SECRET:StudyMateLocalDevelopmentOnlySecretKey2026}
    expiration-ms: 86400000

  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
